<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Застосунки Якова Коротенка</title>
<link rel="alternate" hreflang="en" href="https://cheyako.github.io/apps/en/">
<link rel="alternate" hreflang="uk" href="https://cheyako.github.io/apps/uk/">
<link rel="alternate" hreflang="x-default" href="https://cheyako.github.io/apps/">
<script
  defer
  src="https://umami.apps.mare.pp.ua/script.js"
  data-website-id="697087b8-fc7b-4eba-9d7e-e375b8bba8c8">
</script>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbf9f5;
    --text: #2a2420;
    --text-muted: #6b6055;
    --accent: #b8720e;
    --border: #e4ddd1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1815;
      --text: #f0eae0;
      --text-muted: #a79b8c;
      --accent: #e0a542;
      --border: #3a322a;
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 34rem;
    margin: 0 auto;
    padding: 3.5rem 1.5rem 3rem;
    line-height: 1.55;
    color: var(--text);
    background: var(--bg);
  }
  a { color: var(--accent); }
  .top {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 2rem;
  }
  .lang { font-size: 0.85rem; color: var(--text-muted); }
  .lang a { color: var(--text-muted); text-decoration: none; }
  .lang a:hover { color: var(--accent); }
  .eyebrow {
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin: 0 0 0.6rem;
  }
  h1 {
    font-size: 1.9rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    text-wrap: balance;
    margin: 0 0 2.5rem;
  }
  .apps { list-style: none; padding: 0; margin: 0; }
  .apps li {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1.5rem;
    padding: 1.1rem 0;
    border-top: 1px solid var(--border);
  }
  .apps li:last-child { border-bottom: 1px solid var(--border); }
  .apps a {
    font-size: 1.05rem;
    font-weight: 600;
    text-decoration: none;
  }
  .apps a:hover { text-decoration: underline; }
  .apps p {
    margin: 0;
    color: var(--text-muted);
    font-size: 0.92rem;
    text-align: right;
  }
  footer {
    margin-top: 3.5rem;
    font-size: 0.82rem;
    color: var(--text-muted);
  }
</style>
</head>
<body>
  <div class="top">
    <nav class="lang"><a href="../en/" hreflang="en" lang="en">English</a> &middot; <span aria-current="page">Українська</span></nav>
  </div>
  <p class="eyebrow">Підтримка та інформація</p>
  <h1>Застосунки Якова Коротенка</h1>
  <ul class="apps">
    <li>
      <a href="lirnyk/">Lirnyk</a>
      <p>Перефразування тексту з ШІ просто з рядка меню Mac</p>
    </li>
    <li>
      <a href="wickcontrol/">WickControl</a>
      <p>Облік запасів і собівартості для свічкарів</p>
    </li>
  </ul>
  <footer>&copy; 2026 Яків Коротенко</footer>
</body>
</html>
