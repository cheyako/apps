<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apps by Iakov Korotenko</title>
<link rel="alternate" hreflang="en" href="https://cheyako.github.io/apps/en/">
<link rel="alternate" hreflang="uk" href="https://cheyako.github.io/apps/uk/">
<link rel="alternate" hreflang="x-default" href="https://cheyako.github.io/apps/">
<script>
  var langs = navigator.languages || [navigator.language];
  var uk = langs.some(function (l) { return /^uk\b/i.test(l); });
  location.replace("" + (uk ? "uk/" : "en/") + "" + location.hash);
</script>
<noscript><meta http-equiv="refresh" content="0; url=en/"></noscript>
</head>
<body>
  <p><a href="en/">English</a> &middot; <a href="uk/" lang="uk">Українська</a></p>
</body>
