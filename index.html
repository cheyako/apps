<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apps by Iakov Korotenko</title>
<script
  defer
  src="https://umami.apps.mare.pp.ua/script.js"
  data-website-id="cheyako.github.io">
</script>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbf9f5;
    --text: #2a2420;
    --text-muted: #6b6055;
    --accent: #b8720e;
    --border: #e4ddd1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1815;
      --text: #f0eae0;
      --text-muted: #a79b8c;
      --accent: #e0a542;
      --border: #3a322a;
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 34rem;
    margin: 0 auto;
    padding: 5rem 1.5rem 3rem;
    line-height: 1.55;
    color: var(--text);
    background: var(--bg);
  }
  a { color: var(--accent); }
  .eyebrow {
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin: 0 0 0.6rem;
  }
  h1 {
    font-size: 1.9rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    text-wrap: balance;
    margin: 0 0 2.5rem;
  }
  .apps { list-style: none; padding: 0; margin: 0; }
  .apps li {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1.5rem;
    padding: 1.1rem 0;
    border-top: 1px solid var(--border);
  }
  .apps li:last-child { border-bottom: 1px solid var(--border); }
  .apps a {
    font-size: 1.05rem;
    font-weight: 600;
    text-decoration: none;
  }
  .apps a:hover { text-decoration: underline; }
  .apps p {
    margin: 0;
    color: var(--text-muted);
    font-size: 0.92rem;
    text-align: right;
  }
  footer {
    margin-top: 3.5rem;
    font-size: 0.82rem;
    color: var(--text-muted);
  }
</style>
</head>
<body>
  <p class="eyebrow">Support &amp; information</p>
  <h1>Apps by Iakov Korotenko</h1>
  <ul class="apps">
    <li>
      <a href="lirnyk/">Lirnyk</a>
      <p>AI text rephrasing from the Mac menu bar</p>
    </li>
    <li>
      <a href="wickcontrol/">WickControl</a>
      <p>Inventory &amp; cost tracking for candle makers</p>
    </li>
  </ul>
  <footer>&copy; 2026 Iakov Korotenko</footer>
</body>
</html>
